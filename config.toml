base_url = "https://optozorax.github.io/"
title = "optozorax.blog"
description = "Мои програмульки и результаты их работы"
default_language = "ru"
output_dir = "docs"
compile_sass = true
minify_html = false
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
	{name = "tags"},
]
build_search_index = false
ignored_content = ["static/youtube/*.json"]

[markdown]
external_links_external = false

[markdown.highlighting]
# Zola 0.22 replaced its highlighter, this is the old built-in "cheerfully-light" theme converted to the new format
theme = "cheerfully-light"
extra_themes = ["highlighting/cheerfully-light.json"]
# Zola templates in code blocks were plain text before, keep their "zola" label
extra_grammars = ["highlighting/zola.json"]
# The language label of code blocks is made from the data-lang attribute of <pre>
data_attr_position = "both"

# Interface strings of the default language, templates get them with `trans(key=..., lang=lang)`
[translations]
